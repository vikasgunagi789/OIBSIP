<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | TaskFlow</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="auth-page">


    <main class="auth-container">


        <section class="auth-card">


            <!-- BRAND -->

            <div class="auth-brand">

                <a
                    href="login.html"
                    class="auth-logo"
                >
                    Task<span>Flow</span>
                </a>

                <p>
                    Secure Authentication System
                </p>

            </div>



            <!-- HEADING -->

            <div class="auth-heading">

                <p class="auth-eyebrow">
                    WELCOME BACK
                </p>

                <h1>
                    Sign in to your account
                </h1>

                <p>
                    Enter your credentials to continue
                    to your dashboard.
                </p>

            </div>



            <!-- ERROR MESSAGE -->

            <div
                class="auth-message error-message"
                id="loginError"
            >
            </div>



            <!-- LOGIN FORM -->

            <form
                id="loginForm"
                novalidate
            >


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                        >

                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="2"
                            />

                            <path
                                d="m3 7 9 6 9-6"
                            />

                        </svg>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="you@example.com"
                            autocomplete="email"
                        >

                    </div>

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <div class="password-label">

                        <label for="loginPassword">
                            Password
                        </label>

                    </div>


                    <div class="input-wrapper">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                        >

                            <rect
                                x="5"
                                y="10"
                                width="14"
                                height="10"
                                rx="2"
                            />

                            <path
                                d="M8 10V7a4 4 0 0 1 8 0v3"
                            />

                        </svg>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                        >


                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Show password"
                        >

                            <svg
                                id="eyeIcon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                            >

                                <path
                                    d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                />

                            </svg>

                        </button>

                    </div>

                </div>



                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="auth-submit"
                >

                    Sign In

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >

                        <path d="M5 12h14"></path>

                        <path d="m13 6 6 6-6 6"></path>

                    </svg>

                </button>


            </form>



            <!-- REGISTER -->

            <div class="auth-switch">

                <span>
                    Don't have an account?
                </span>

                <a href="register.html">
                    Create account
                </a>

            </div>


        </section>


    </main>



    <script>

        /* =====================================================
           ELEMENTS
        ===================================================== */

        const loginForm =
            document.getElementById("loginForm");

        const loginEmail =
            document.getElementById("loginEmail");

        const loginPassword =
            document.getElementById("loginPassword");

        const loginError =
            document.getElementById("loginError");

        const togglePassword =
            document.getElementById("togglePassword");



        /* =====================================================
           SHA-256 HASH
        ===================================================== */

        async function hashPassword(password) {

            const encoder =
                new TextEncoder();

            const data =
                encoder.encode(password);

            const hashBuffer =
                await crypto.subtle.digest(
                    "SHA-256",
                    data
                );

            const hashArray =
                Array.from(
                    new Uint8Array(hashBuffer)
                );

            return hashArray
                .map(
                    byte =>
                        byte
                            .toString(16)
                            .padStart(2, "0")
                )
                .join("");

        }



        /* =====================================================
           SHOW PASSWORD
        ===================================================== */

        togglePassword.addEventListener(
            "click",
            function () {

                if (
                    loginPassword.type ===
                    "password"
                ) {

                    loginPassword.type =
                        "text";

                } else {

                    loginPassword.type =
                        "password";

                }

            }
        );



        /* =====================================================
           LOGIN
        ===================================================== */

        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                loginError.textContent = "";


                const email =
                    loginEmail.value
                        .trim()
                        .toLowerCase();


                const password =
                    loginPassword.value;



                /* ---------------------------------------------
                   VALIDATION
                --------------------------------------------- */

                if (
                    email === "" ||
                    password === ""
                ) {

                    loginError.textContent =
                        "Please enter your email and password.";

                    return;

                }


                if (
                    !email.includes("@") ||
                    !email.includes(".")
                ) {

                    loginError.textContent =
                        "Please enter a valid email address.";

                    return;

                }



                /* ---------------------------------------------
                   GET REGISTERED USERS
                --------------------------------------------- */

                const users =
                    JSON.parse(
                        localStorage.getItem(
                            "taskflowUsers"
                        )
                    ) || [];



                /* ---------------------------------------------
                   FIND USER
                --------------------------------------------- */

                const user =
                    users.find(
                        currentUser =>
                            currentUser.email === email
                    );



                /*
                    Do NOT tell the user whether
                    email or password is incorrect.
                */

                if (!user) {

                    loginError.textContent =
                        "Invalid email or password.";

                    return;

                }



                /* ---------------------------------------------
                   HASH ENTERED PASSWORD
                --------------------------------------------- */

                const hashedPassword =
                    await hashPassword(password);



                /* ---------------------------------------------
                   CHECK PASSWORD
                --------------------------------------------- */

                if (
                    hashedPassword !==
                    user.password
                ) {

                    loginError.textContent =
                        "Invalid email or password.";

                    return;

                }



                /* ---------------------------------------------
                   CREATE SESSION
                --------------------------------------------- */

                localStorage.setItem(
                    "isLoggedIn",
                    "true"
                );


                localStorage.setItem(
                    "username",
                    user.username
                );


                localStorage.setItem(
                    "email",
                    user.email
                );



                /* ---------------------------------------------
                   REDIRECT
                --------------------------------------------- */

                window.location.href =
                    "dashboard.html";

            }
        );

    </script>


</body>

</html>
