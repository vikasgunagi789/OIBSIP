<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | TaskFlow</title>


    <!-- GOOGLE FONTS -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="auth-page">


    <main class="auth-container">


        <section class="auth-card">


            <!-- =================================================
                 BRAND
            ================================================== -->

            <div class="auth-brand">

                <a
                    href="login.html"
                    class="auth-logo"
                >
                    Task<span>Flow</span>
                </a>

                <p>
                    Secure Authentication System
                </p>

            </div>



            <!-- =================================================
                 HEADING
            ================================================== -->

            <div class="auth-heading">

                <p class="auth-eyebrow">
                    GET STARTED
                </p>

                <h1>
                    Create your account
                </h1>

                <p>
                    Register to access your secure
                    TaskFlow dashboard.
                </p>

            </div>



            <!-- =================================================
                 ERROR / SUCCESS MESSAGE
            ================================================== -->

            <div
                class="auth-message"
                id="registerMessage"
            >
            </div>



            <!-- =================================================
                 REGISTRATION FORM
            ================================================== -->

            <form
                id="registerForm"
                novalidate
            >


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <div class="input-wrapper">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                        >

                            <circle
                                cx="12"
                                cy="8"
                                r="4"
                            />

                            <path
                                d="M4 21c0-4 3.5-7 8-7s8 3 8 7"
                            />

                        </svg>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                        >

                    </div>

                </div>



                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                        >

                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="2"
                            />

                            <path
                                d="m3 7 9 6 9-6"
                            />

                        </svg>

                        <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                        >

                    </div>

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                        >

                            <rect
                                x="5"
                                y="10"
                                width="14"
                                height="10"
                                rx="2"
                            />

                            <path
                                d="M8 10V7a4 4 0 0 1 8 0v3"
                            />

                        </svg>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Show password"
                        >

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                            >

                                <path
                                    d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                />

                            </svg>

                        </button>

                    </div>

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="input-wrapper">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                        >

                            <rect
                                x="5"
                                y="10"
                                width="14"
                                height="10"
                                rx="2"
                            />

                            <path
                                d="M8 10V7a4 4 0 0 1 8 0v3"
                            />

                        </svg>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                        >

                    </div>

                </div>



                <!-- PASSWORD REQUIREMENTS -->

                <div class="password-requirements">

                    <p>
                        Password requirements
                    </p>

                    <span id="lengthRequirement">
                        <i></i>
                        At least 8 characters
                    </span>

                    <span id="numberRequirement">
                        <i></i>
                        At least 1 number
                    </span>

                </div>



                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    class="auth-submit"
                >

                    Create Account

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >

                        <path d="M5 12h14"></path>

                        <path d="m13 6 6 6-6 6"></path>

                    </svg>

                </button>


            </form>



            <!-- =================================================
                 LOGIN LINK
            ================================================== -->

            <div class="auth-switch">

                <span>
                    Already have an account?
                </span>

                <a href="login.html">
                    Sign in
                </a>

            </div>


        </section>


    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>


        /* =================================================
           ELEMENTS
        ================================================= */

        const registerForm =
            document.getElementById(
                "registerForm"
            );

        const usernameInput =
            document.getElementById(
                "username"
            );

        const emailInput =
            document.getElementById(
                "email"
            );

        const passwordInput =
            document.getElementById(
                "password"
            );

        const confirmPasswordInput =
            document.getElementById(
                "confirmPassword"
            );

        const registerMessage =
            document.getElementById(
                "registerMessage"
            );

        const togglePassword =
            document.getElementById(
                "togglePassword"
            );



        /* =================================================
           SHA-256 PASSWORD HASHING
        ================================================= */

        async function hashPassword(password) {

            const encoder =
                new TextEncoder();

            const data =
                encoder.encode(password);

            const hashBuffer =
                await crypto.subtle.digest(
                    "SHA-256",
                    data
                );

            const hashArray =
                Array.from(
                    new Uint8Array(hashBuffer)
                );

            return hashArray
                .map(
                    byte =>
                        byte
                            .toString(16)
                            .padStart(2, "0")
                )
                .join("");

        }



        /* =================================================
           SHOW / HIDE PASSWORD
        ================================================= */

        togglePassword.addEventListener(
            "click",
            function () {

                if (
                    passwordInput.type ===
                    "password"
                ) {

                    passwordInput.type =
                        "text";

                    togglePassword.setAttribute(
                        "aria-label",
                        "Hide password"
                    );

                } else {

                    passwordInput.type =
                        "password";

                    togglePassword.setAttribute(
                        "aria-label",
                        "Show password"
                    );

                }

            }
        );



        /* =================================================
           PASSWORD REQUIREMENTS
        ================================================= */

        passwordInput.addEventListener(
            "input",
            function () {

                const password =
                    passwordInput.value;


                const lengthRequirement =
                    document.getElementById(
                        "lengthRequirement"
                    );

                const numberRequirement =
                    document.getElementById(
                        "numberRequirement"
                    );


                /* 8 characters */

                if (password.length >= 8) {

                    lengthRequirement.classList.add(
                        "valid"
                    );

                } else {

                    lengthRequirement.classList.remove(
                        "valid"
                    );

                }


                /* At least one number */

                if (/\d/.test(password)) {

                    numberRequirement.classList.add(
                        "valid"
                    );

                } else {

                    numberRequirement.classList.remove(
                        "valid"
                    );

                }

            }
        );



        /* =================================================
           REGISTRATION
        ================================================= */

        registerForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                registerMessage.textContent = "";

                registerMessage.className =
                    "auth-message";



                /* -----------------------------------------
                   GET VALUES
                ----------------------------------------- */

                const username =
                    usernameInput.value.trim();

                const email =
                    emailInput.value
                        .trim()
                        .toLowerCase();

                const password =
                    passwordInput.value;

                const confirmPassword =
                    confirmPasswordInput.value;



                /* -----------------------------------------
                   EMPTY CHECK
                ----------------------------------------- */

                if (
                    username === "" ||
                    email === "" ||
                    password === "" ||
                    confirmPassword === ""
                ) {

                    showError(
                        "Please fill in all fields."
                    );

                    return;

                }



                /* -----------------------------------------
                   USERNAME VALIDATION
                ----------------------------------------- */

                if (username.length < 3) {

                    showError(
                        "Username must contain at least 3 characters."
                    );

                    return;

                }



                /* -----------------------------------------
                   EMAIL VALIDATION
                ----------------------------------------- */

                const emailPattern =
                    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


                if (
                    !emailPattern.test(email)
                ) {

                    showError(
                        "Please enter a valid email address."
                    );

                    return;

                }



                /* -----------------------------------------
                   PASSWORD LENGTH
                ----------------------------------------- */

                if (password.length < 8) {

                    showError(
                        "Password must contain at least 8 characters."
                    );

                    return;

                }



                /* -----------------------------------------
                   PASSWORD NUMBER
                ----------------------------------------- */

                if (!/\d/.test(password)) {

                    showError(
                        "Password must contain at least 1 number."
                    );

                    return;

                }



                /* -----------------------------------------
                   CONFIRM PASSWORD
                ----------------------------------------- */

                if (
                    password !==
                    confirmPassword
                ) {

                    showError(
                        "Passwords do not match."
                    );

                    return;

                }



                /* -----------------------------------------
                   GET EXISTING USERS
                ----------------------------------------- */

                const users =
                    JSON.parse(
                        localStorage.getItem(
                            "taskflowUsers"
                        )
                    ) || [];



                /* -----------------------------------------
                   DUPLICATE EMAIL
                ----------------------------------------- */

                const existingUser =
                    users.find(
                        user =>
                            user.email === email
                    );


                if (existingUser) {

                    showError(
                        "An account with this email already exists."
                    );

                    return;

                }



                /* -----------------------------------------
                   HASH PASSWORD
                ----------------------------------------- */

                const hashedPassword =
                    await hashPassword(
                        password
                    );



                /* -----------------------------------------
                   CREATE USER
                ----------------------------------------- */

                const newUser = {

                    username:
                        username,

                    email:
                        email,

                    password:
                        hashedPassword

                };



                /* -----------------------------------------
                   SAVE USER
                ----------------------------------------- */

                users.push(
                    newUser
                );


                localStorage.setItem(
                    "taskflowUsers",
                    JSON.stringify(users)
                );



                /* -----------------------------------------
                   SUCCESS
                ----------------------------------------- */

                registerMessage.textContent =
                    "Account created successfully. Redirecting to login...";

                registerMessage.className =
                    "auth-message success-message";



                /* -----------------------------------------
                   REDIRECT
                ----------------------------------------- */

                setTimeout(
                    function () {

                        window.location.href =
                            "login.html";

                    },
                    1200
                );

            }
        );



        /* =================================================
           ERROR FUNCTION
        ================================================= */

        function showError(message) {

            registerMessage.textContent =
                message;

            registerMessage.className =
                "auth-message error-message";

        }

    </script>


</body>

</html>
